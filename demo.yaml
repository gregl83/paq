settings:
  title: paq — one hash for an entire directory
  width: 78
  height: 16
  prompt: "\e[92m$\e[0m "
  type_speed: 40ms
  environment:
    - name: TERM
      value: "xterm-256color"

instructions:
  - !Command
    command: "# hash a directory"
    type_speed: 0ms
  - !Command
    command: paq ./example
  - !Wait 3s
  - !Command
    command: "# ignore hidden files"
    type_speed: 0ms
  - !Command
    command: paq --ignore-hidden ./example
  - !Wait 3s
  - !Command
    command: "# save the result"
    type_speed: 0ms
  - !Command
    command: paq --ignore-hidden -o ./example
  - !Wait 1s
  - !Command
    command: cat example.paq; echo
  - !Wait 3s
