name: cd

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    uses: ./.github/workflows/installer.yml

  all-go:
    name: all systems go
    runs-on: ubuntu-latest
    needs:
      - test
      - cover
      - build
      - release
      - publish
    steps:
      - run: exit 0

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # --- Linux ---
          - os: ubuntu-latest
            architecture: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            architecture: x86
            target: i686-unknown-linux-gnu

          # --- Windows ---
          - os: windows-latest
            architecture: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            architecture: x86
            target: i686-pc-windows-msvc

          # --- macOS Apple Silicon ---
          - os: macos-latest
            architecture: arm64
            target: aarch64-apple-darwin
          # --- macOS Intel ---
          - os: macos-15-intel
            architecture: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup component add llvm-tools-preview
          rustup target add ${{ matrix.target }}

      - name: Install 32-bit Support
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Run Tests
        run: cargo test --target ${{ matrix.target }} --verbose -- --nocapture

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.15
        with:
          tool: cargo-llvm-cov

      - name: Generate Code Coverage Report
        run: cargo llvm-cov --all-features --workspace --fail-under-functions 80 --fail-under-lines 80 --fail-under-regions 80 --lcov --output-path ./target/lcov.info

      - name: Publish Coverage Report
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./target/lcov.info
          verbose: true
          fail_ci_if_error: true

  build:
    needs:
      - installer
      - test
      - cover
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # --- Linux ---
          - os: ubuntu-latest
            architecture: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            architecture: x86
            target: i686-unknown-linux-gnu

          # --- Windows ---
          - os: windows-latest
            architecture: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            architecture: x86
            target: i686-pc-windows-msvc

          # --- macOS Apple Silicon ---
          - os: macos-latest
            architecture: arm64
            target: aarch64-apple-darwin
          # --- macOS Intel ---
          - os: macos-15-intel
            architecture: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup component add llvm-tools-preview
          rustup target add ${{ matrix.target }}

      - name: Install 32-bit Support
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.architecture }}
          path: target/${{ matrix.target }}/release/

  package-release:
    needs:
      - test
      - cover
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # --- Linux ---
          - os: ubuntu-latest
            architecture: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            architecture: x86
            target: i686-unknown-linux-gnu

          # --- Windows ---
          - os: windows-latest
            architecture: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            architecture: x86
            target: i686-pc-windows-msvc

          # --- macOS Apple Silicon ---
          - os: macos-latest
            architecture: arm64
            target: aarch64-apple-darwin
          # --- macOS Intel ---
          - os: macos-15-intel
            architecture: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.os }}-${{ matrix.architecture }}
          path: ${{ matrix.os }}-${{ matrix.architecture }}

      - name: Set Build File Variables
        id: vars
        run: |
          name=$(awk -F '= ' '/^\[package\]/{found=1} found && /^name/{gsub(/["]/, "", $2); print $2; exit}' Cargo.toml)
          case "${{ matrix.os }}" in
            *"ubuntu"*)  os="ubuntu" ;;
            *"windows"*) os="windows" ;;
            *"macos"*)   os="macos" ;;
          esac
          if [[ "$os" == "windows" ]]; then
            ext=".exe"
          else
            ext=""
          fi
          {
            echo "name=$name"
            echo "os=$os"
            echo "ext=$ext"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Artifacts
        run: |
          source=$(find ${{ matrix.os }}-${{ matrix.architecture }} -name "${{ steps.vars.outputs.name }}${{ steps.vars.outputs.ext }}" -type f | head -n 1)
          binary=paq${{ steps.vars.outputs.ext }}
          archive=${{ steps.vars.outputs.name }}-${{ steps.vars.outputs.os }}-${{ matrix.architecture }}.zip
          mv "$source" "$binary"
          zip "$archive" "$binary"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload Release Assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.vars.outputs.os }}-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            ${{ steps.vars.outputs.name }}-${{ steps.vars.outputs.os }}-${{ matrix.architecture }}.zip
            ${{ steps.vars.outputs.name }}-${{ steps.vars.outputs.os }}-${{ matrix.architecture }}.zip.sha256

  smoke-release:
    needs: package-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: ubuntu-x64
          - os: ubuntu-latest
            platform: ubuntu-x86
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-latest
            platform: windows-x64
          - os: windows-latest
            platform: windows-x86
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download Packaged Release
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.platform }}
          path: release-assets
      - name: Install 32-bit Runtime
        if: matrix.platform == 'ubuntu-x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Test Packaged Executable
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: python bin/smoke-release.py release-assets "$RELEASE_PLATFORM" "${RELEASE_TAG#v}"

  release:
    needs: [package-release, smoke-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download All Release Assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Upload and Publish Complete Release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash ../bin/publish-release.sh "$RELEASE_TAG"

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Publish Crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
